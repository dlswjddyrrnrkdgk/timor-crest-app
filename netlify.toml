[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 3D tour assets live under a versioned path (e.g. /tour-assets/e-type/v2/),
# so they can be cached for a long time.
[[headers]]
  for = "/tour-assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/tour-assets/*.ktx2"
  [headers.values]
    Content-Type = "image/ktx2"
